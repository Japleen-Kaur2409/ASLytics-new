[project]
name = "aslytics"
version = "0.1.0"
description = "Dataset pipeline for English -> ASL pose generation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy<2",
    "scipy",
    "pandas",
    "pyarrow<21",  # newer pyarrow needs NumPy 2, MediaPipe needs NumPy 1
    "opencv-python-headless",
    "mediapipe==0.10.21",
    "requests",
    "youtube-transcript-api>=1.0",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
aslytics = "aslytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aslytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
